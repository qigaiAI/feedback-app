<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
h1 { font-size: 20px; margin-bottom: 12px; }
input, button, textarea { padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
button { background: #4F46E5; color: #fff; border: none; cursor: pointer; }
button:active { opacity: 0.8; }
button.danger { background: #ef4444; }
button.small { padding: 4px 10px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
th { background: #fafafa; font-weight: 600; }
tr:hover { background: #fafafa; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-ok { background: #dcfce7; color: #166534; }
.badge-no { background: #fef3c7; color: #92400e; }
.bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
#msg { font-size: 13px; margin: 8px 0; }
.tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid #e5e7eb; }
.tab { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; background: none; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: #4F46E5; border-bottom-color: #4F46E5; }
.msg-card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.msg-card .meta { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
.msg-card .body { font-size: 14px; white-space: pre-wrap; }
</style>
</head>
<body>
<script>
// Clean up old service workers that block /admin.html
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    if (regs.length > 0) {
      Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
        caches.keys().then(function(keys) {
          Promise.all(keys.map(function(k) { return caches.delete(k); }));
        });
        if (navigator.serviceWorker.controller) {
          window.location.reload();
        }
      });
    }
  });
}
</script>
<h1>管理后台</h1>
<div class="bar">
  <input id="key" type="password" placeholder="Admin Key" style="width:160px">
  <button onclick="loadUsers()">加载</button>
</div>
<div id="msg"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('users')">用户管理</button>
  <button class="tab" onclick="switchTab('messages')">用户留言</button>
  <button class="tab" onclick="switchTab('keys')">升级密钥</button>
</div>

<div id="tab-users">
  <table id="table" style="display:none">
  <thead><tr><th>邮箱</th><th>昵称</th><th>验证</th><th>注册时间</th><th>操作</th></tr></thead>
  <tbody id="tbody"></tbody>
  </table>
</div>

<div id="tab-messages" style="display:none">
  <div id="msgList"></div>
</div>

<div id="tab-keys" style="display:none">
  <div class="bar" style="margin-top:16px">
    <input id="genCount" type="number" value="5" min="1" max="50" style="width:80px" placeholder="数量">
    <button onclick="genKeys()">生成密钥</button>
    <button onclick="loadKeys()">刷新列表</button>
  </div>
  <table id="keysTable" style="display:none">
  <thead><tr><th>密钥</th><th>状态</th><th>使用者</th><th>使用时间</th><th>生成时间</th></tr></thead>
  <tbody id="keysTbody"></tbody>
  </table>
</div>

<script>
const API = '/api/admin';
let key = '';

function msg(text, color = '#333') {
  document.getElementById('msg').innerHTML = `<span style="color:${color}">${text}</span>`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'users' && i === 0) || (tab === 'messages' && i === 1) || (tab === 'keys' && i === 2));
  });
  document.getElementById('tab-users').style.display = tab === 'users' ? '' : 'none';
  document.getElementById('tab-messages').style.display = tab === 'messages' ? '' : 'none';
  document.getElementById('tab-keys').style.display = tab === 'keys' ? '' : 'none';
  if (tab === 'messages') loadMessages();
  if (tab === 'users') loadUsers();
  if (tab === 'keys') loadKeys();
}

// ---- Users ----
async function loadUsers() {
  key = document.getElementById('key').value;
  if (!key) { msg('请输入 Admin Key', 'red'); return; }
  try {
    const r = await fetch(`${API}/users`, { headers: { 'X-Admin-Key': key } });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    msg(`共 ${data.users.length} 个用户`, '#333');
    document.getElementById('table').style.display = '';
    document.getElementById('tbody').innerHTML = data.users.map(u => `
      <tr>
        <td>${u.email}</td>
        <td>${u.name}</td>
        <td><span class="badge ${u.email_verified ? 'badge-ok' : 'badge-no'}">${u.email_verified ? '已验证' : '未验证'}</span></td>
        <td>${new Date(u.created_at).toLocaleString('zh-CN')}</td>
        <td style="display:flex;gap:4px;flex-wrap:wrap">
          ${u.email_verified ? '' : `<button class="small" onclick="verifyUser('${u.id}',true)">验证</button>`}
          <button class="small" onclick="showCode('${u.id}')">验证码</button>
          <button class="small danger" onclick="delUser('${u.id}','${u.email}')">删除</button>
        </td>
      </tr>
    `).join('');
  } catch (e) { msg('网络错误', 'red'); }
}

async function verifyUser(id, verified) {
  if (!confirm(`确认${verified ? '手动验证' : '取消验证'}？`)) return;
  try {
    const r = await fetch(`${API}/users/${id}/verify`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ verified })
    });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    msg('操作成功', 'green');
    loadUsers();
  } catch (e) { msg('网络错误', 'red'); }
}

async function showCode(id) {
  try {
    const r = await fetch(`${API}/users/${id}/code`, { headers: { 'X-Admin-Key': key } });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    msg(`验证码: <b>${data.verification_token || '无'}</b> (过期: ${data.verification_token_expires ? new Date(data.verification_token_expires).toLocaleString('zh-CN') : '无'})`, 'green');
  } catch (e) { msg('网络错误', 'red'); }
}

async function delUser(id, email) {
  if (!confirm(`确定删除 ${email}？`)) return;
  try {
    const r = await fetch(`${API}/users/${id}`, { method: 'DELETE', headers: { 'X-Admin-Key': key } });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    msg('已删除', 'green');
    loadUsers();
  } catch (e) { msg('网络错误', 'red'); }
}

// ---- Messages ----
async function loadMessages() {
  key = document.getElementById('key').value;
  if (!key) { msg('请输入 Admin Key', 'red'); return; }
  try {
    const r = await fetch(`${API}/messages`, { headers: { 'X-Admin-Key': key } });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    if (data.messages.length === 0) {
      document.getElementById('msgList').innerHTML = '<p style="color:#9ca3af;text-align:center;padding:24px">暂无留言</p>';
      return;
    }
    msg(`共 ${data.messages.length} 条留言`, '#333');
    document.getElementById('msgList').innerHTML = data.messages.map(m => `
      <div class="msg-card">
        <div class="meta">${m.name} (${m.email}) · ${new Date(m.created_at).toLocaleString('zh-CN')}</div>
        <div class="body">${m.content}</div>
      </div>
    `).join('');
  } catch (e) { msg('网络错误', 'red'); }
}

// ---- Upgrade Keys ----
async function genKeys() {
  key = document.getElementById('key').value;
  if (!key) { msg('请输入 Admin Key', 'red'); return; }
  const count = parseInt(document.getElementById('genCount').value) || 5;
  try {
    const r = await fetch(`${API}/upgrade-keys/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ count })
    });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    msg(`已生成 ${data.keys.length} 个密钥`, 'green');
    loadKeys();
  } catch (e) { msg('网络错误', 'red'); }
}

async function loadKeys() {
  key = document.getElementById('key').value;
  if (!key) { msg('请输入 Admin Key', 'red'); return; }
  try {
    const r = await fetch(`${API}/upgrade-keys`, { headers: { 'X-Admin-Key': key } });
    const data = await r.json();
    if (data.error) { msg(data.error, 'red'); return; }
    msg(`共 ${data.keys.length} 个密钥`, '#333');
    document.getElementById('keysTable').style.display = data.keys.length ? '' : 'none';
    document.getElementById('keysTbody').innerHTML = data.keys.map(k => `
      <tr>
        <td style="font-family:monospace">${k.key}</td>
        <td><span class="badge ${k.used_by ? 'badge-no' : 'badge-ok'}">${k.used_by ? '已使用' : '未使用'}</span></td>
        <td>${k.used_by_name ? `${k.used_by_name} (${k.used_by_email})` : '-'}</td>
        <td>${k.used_at ? new Date(k.used_at).toLocaleString('zh-CN') : '-'}</td>
        <td>${new Date(k.created_at).toLocaleString('zh-CN')}</td>
      </tr>
    `).join('');
  } catch (e) { msg('网络错误', 'red'); }
}
</script>
</body>
</html>
